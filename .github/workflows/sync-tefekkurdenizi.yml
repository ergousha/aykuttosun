name: Sync tefekkurdenizi.com

# Günde 2 kez (09:00 ve 21:00 Türkiye saati) tefekkurdenizi.com'u kontrol eder.
# Hedef dal TARGET (legacy) dalıdır; main artık otomatik eşitlenmez. Zamanlanmış çalıştırmalar her zaman
# varsayılan daldaki (main) bu dosyayı kullanır, bu yüzden iş TARGET dalını checkout edip oraya yazar.
#  1) Ana sayfadaki günün ayeti / hadisi / sözü doğrudan TARGET'a işlenir (küçük, otomatik doğrulanır).
#  2) Yeni makale / deneme / şiir / söz / etkinlik varsa TARGET'a karşı tek bir PR açılır/güncellenir (incelemeli).
# Elle çalıştırırken "dry_run" seçilirse (ya da main/TARGET dışındaki bir dalda çalışırsa) hiçbir şey
# push edilmez; rapor iş özetine yazılır ve güncellenmiş data.js artefakt olarak yüklenir.
on:
  schedule:
    - cron: "0 6,18 * * *" # 06:00 ve 18:00 UTC = 09:00 ve 21:00 TSİ (UTC+3, yaz/kış saati yok)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme: push / PR yapma, sonucu artefakt olarak yükle"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Hepsi aynı dala (legacy) yazdığından tetikleyen daldan bağımsız tek kuyruk
concurrency:
  group: sync-tefekkurdenizi-legacy
  cancel-in-progress: false

env:
  # Eşitlemenin yazıldığı dal (doğrudan commit'ler ve PR tabanı)
  TARGET: legacy
  BRANCH: auto/tefekkurdenizi-sync
  # Yalnızca main ya da legacy'den tetiklenince ve deneme kipi kapalıyken yazılır
  PUBLISH: ${{ (github.ref_name == 'main' || github.ref_name == 'legacy') && !inputs.dry_run }}

defaults:
  run:
    # "bash" açıkça verilince Actions -eo pipefail kullanır; "| tee" artık hatayı yutmaz.
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pdftotext (PDF olarak yayımlanan yazılar için)
        run: command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }

      - name: Git kimliği
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Günün ayeti / hadisi / sözü (doğrudan hedef dala)
        env:
          REPORT_FILE: ${{ runner.temp }}/daily-report.md
        run: |
          node tools/sync-tefekkur.js --daily | tee "$RUNNER_TEMP/daily.log"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^CHANGED=true' "$RUNNER_TEMP/daily.log" && [ "$PUBLISH" = "true" ]; then
            node tools/build.js
            git add -A
            git commit -m "Update verse, hadith and quote of the day from tefekkurdenizi.com" -m "$(sed 1,2d "$REPORT_FILE")"
            git pull --rebase origin "$TARGET"
            git push origin "HEAD:$TARGET"
          fi

      - name: Kaynak siteyi karşılaştır ve data.js'i güncelle
        id: sync
        env:
          REPORT_FILE: ${{ runner.temp }}/sync-report.md
        run: |
          node tools/sync-tefekkur.js | tee "$RUNNER_TEMP/sync.log"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^CHANGED=true' "$RUNNER_TEMP/sync.log"; then echo "changed=true"; else echo "changed=false"; fi >> "$GITHUB_OUTPUT"

      - name: Sayfaları yeniden üret
        if: steps.sync.outputs.changed == 'true'
        run: node tools/build.js

      - name: Deneme sonucu (artefakt)
        if: steps.sync.outputs.changed == 'true' && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-result
          path: |
            assets/data.js
            ${{ runner.temp }}/sync-report.md

      - name: Dal oluştur, push et ve PR aç/güncelle
        if: steps.sync.outputs.changed == 'true' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Sync new content from tefekkurdenizi.com"
          git push --force origin "$BRANCH"
          BODY="$(cat "$REPORT")

          ---
          _Otomatik oluşturuldu (\`.github/workflows/sync-tefekkurdenizi.yml\`). Birleştirmeden önce metinleri kaynakla karşılaştırın._"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --base "$TARGET" --title "Tefekkür Denizi eşitlemesi: yeni içerik" --body "$BODY"
          else
            gh pr create --base "$TARGET" --head "$BRANCH" --title "Tefekkür Denizi eşitlemesi: yeni içerik" --body "$BODY"
          fi
