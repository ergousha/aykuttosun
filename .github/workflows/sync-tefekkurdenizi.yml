name: Sync tefekkurdenizi.com

# Günde 2 kez (09:00 ve 21:00 Türkiye saati) tefekkurdenizi.com'u kontrol eder.
#  1) Ana sayfadaki günün ayeti / hadisi / sözü doğrudan main'e işlenir (küçük, otomatik doğrulanır).
#  2) Yeni makale / deneme / şiir / söz / etkinlik varsa tek bir PR açılır/güncellenir (incelemeli).
on:
  schedule:
    - cron: "0 6,18 * * *" # 06:00 ve 18:00 UTC = 09:00 ve 21:00 TSİ (UTC+3, yaz/kış saati yok)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-tefekkurdenizi
  cancel-in-progress: false

env:
  BRANCH: auto/tefekkurdenizi-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Günün ayeti / hadisi / sözü (doğrudan main)
        id: daily
        env:
          REPORT_FILE: ${{ runner.temp }}/daily-report.md
        run: |
          node tools/sync-tefekkur.js --daily | tee "$RUNNER_TEMP/daily.log"
          if grep -q '^CHANGED=true' "$RUNNER_TEMP/daily.log"; then
            node tools/build.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update verse, hadith and quote of the day from tefekkurdenizi.com" -m "$(sed 1,2d "$RUNNER_TEMP/daily-report.md")"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Kaynak siteyi karşılaştır ve data.js'i güncelle
        id: sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || vars.GEMINI_MODEL }}
          REPORT_FILE: ${{ runner.temp }}/sync-report.md
        run: node tools/sync-tefekkur.js | tee "$RUNNER_TEMP/sync.log"; grep -q '^CHANGED=true' "$RUNNER_TEMP/sync.log" && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Sayfaları yeniden üret
        if: steps.sync.outputs.changed == 'true'
        run: node tools/build.js

      - name: Dal oluştur, push et ve PR aç/güncelle
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Sync new content from tefekkurdenizi.com"
          git push --force origin "$BRANCH"
          BODY="$(cat "$REPORT")

          ---
          _Otomatik oluşturuldu (\`.github/workflows/sync-tefekkurdenizi.yml\`). Birleştirmeden önce metinleri kaynakla karşılaştırın._"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "Tefekkür Denizi eşitlemesi: yeni içerik" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "Tefekkür Denizi eşitlemesi: yeni içerik" --body "$BODY"
          fi
